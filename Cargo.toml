[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Grimmy <grimmy024@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/grimmy-dev/_lazyrig"
description = "A lazyvim-inspired multi-agent harness: lazy, customizable and minimal"
publish = false

[workspace.dependencies]
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
trash = "5"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1
